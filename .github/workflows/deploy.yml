name: Deploy RINLU website and Docker music platform

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: rinlu-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify the canonical platform release
        id: platform
        run: node scripts/prepare-platform.mjs

      - name: Test native mobile API gateway before accessing deployment credentials
        if: steps.platform.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node --test services/mobile-gateway/mobile-api.test.mjs

      - name: Verify Madimi One wordmark overlay
        if: steps.platform.outputs.changed == 'true'
        run: |
          node --check scripts/apply-platform-brand.mjs
          node --test scripts/test-platform-brand.mjs

      - name: Build the complete platform client and gateway
        if: steps.platform.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm install --global pnpm@11.25.0
          cd .platform-source/rinlu-player-source
          pnpm install --frozen-lockfile
          node scripts/tests/accounts-integration.mjs
          node scripts/tests/external-auth-integration.mjs
          node scripts/tests/platform-gateway.test.mjs
          pnpm exec vite build --config deployment/platform/vite.config.mjs
          cd ../..
          node scripts/package-platform.mjs
          rm -rf .platform-source

      - name: Validate processor before accessing deployment credentials
        if: steps.platform.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s services/media-worker -p 'test_*.py'
          python3 -m py_compile services/media-worker/worker.py
          bash -n services/ovh/deploy-worker.sh

      - name: Verify OVH S3 secret rendering without production credentials
        if: steps.platform.outputs.changed == 'true'
        run: node --test scripts/tests/render-ovh-s3-env.test.mjs

      - name: Verify real OVH S3 private write/read/delete before deployment
        if: steps.platform.outputs.changed == 'true'
        env:
          OVH_S3_BUCKET: ${{ vars.OVH_S3_BUCKET }}
          OVH_S3_REGION: ${{ vars.OVH_S3_REGION }}
          OVH_S3_ENDPOINT: ${{ vars.OVH_S3_ENDPOINT }}
          OVH_S3_ACCESS_KEY_ID: ${{ secrets.OVH_S3_ACCESS_KEY_ID }}
          OVH_S3_SECRET_ACCESS_KEY: ${{ secrets.OVH_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          node --test services/ovh-s3/tests/*.test.mjs
          node scripts/verify-ovh-s3.mjs
          python3 -m pip install --quiet boto3
          python3 scripts/configure-ovh-s3-cors.py
          node scripts/probe-ovh-s3-browser-direct.mjs

      - name: Configure verified SSH identity
        if: steps.platform.outputs.changed == 'true'
        env:
          PRIVATE_KEY: ${{ secrets.OVH_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        if: steps.platform.outputs.changed == 'true'
        env:
          HOST: ${{ secrets.OVH_HOST }}
          USER: ${{ secrets.OVH_USER }}
          PORT: ${{ vars.OVH_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER"
          rsync -az --delete --safe-links --exclude='.git/' --exclude='.github/' --exclude='.platform-source/' --exclude='node_modules/' -e "ssh -p $PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" ./ "$USER@$HOST:/home/ubuntu/rinlu-staging/"

      - name: Stage optional RINLU processor secrets
        if: steps.platform.outputs.changed == 'true'
        env:
          PROCESSOR: ${{ secrets.RINLU_PROCESSOR_TOKEN }}
          SITE_ACCESS: ${{ secrets.RINLU_SITES_ACCESS_TOKEN }}
          HOST: ${{ secrets.OVH_HOST }}
          USER: ${{ secrets.OVH_USER }}
          PORT: ${{ vars.OVH_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          if [[ -z "$PROCESSOR" || -z "$SITE_ACCESS" ]]; then
            echo 'Processor secrets are not configured; preserving website-only deployment.'
            exit 0
          fi
          python3 - <<'PY'
          import os,pathlib
          values={'RINLU_ORIGIN':'https://sonora-independent-music.kai-ma.chatgpt.site','RINLU_PROCESSOR_TOKEN':os.environ['PROCESSOR'],'RINLU_SITES_ACCESS_TOKEN':os.environ['SITE_ACCESS']}
          assert all(not any(c in v for c in '\r\n\0') for v in values.values())
          p=pathlib.Path('/tmp/rinlu-worker.env');p.touch(mode=0o600);p.write_text(''.join(k+'='+v+'\n' for k,v in values.items()))
          PY
          trap 'rm -f /tmp/rinlu-worker.env' EXIT
          scp -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes /tmp/rinlu-worker.env "$USER@$HOST:/home/ubuntu/rinlu-worker.env"

      - name: Deliver Google credentials to the OVH runtime
        if: steps.platform.outputs.changed == 'true'
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          HOST: ${{ secrets.OVH_HOST }}
          USER: ${{ secrets.OVH_USER }}
          PORT: ${{ vars.OVH_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$GOOGLE_CLIENT_SECRET" =~ ^[A-Za-z0-9_-]+$ ]] || { echo 'Missing or invalid Google client secret'; exit 1; }
          printf 'GOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\n' '370963831446-7jm67b901aag972anf6t22vh6l7sltt0.apps.googleusercontent.com' "$GOOGLE_CLIENT_SECRET" |
            ssh -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'set -eu; umask 077; f=$(mktemp "$HOME/.rinlu-google.XXXXXX"); trap '\''rm -f "$f"'\'' EXIT; cat > "$f"; mv -f "$f" "$HOME/rinlu-google.env"'

      - name: Stage optional OVH S3 credentials for the Docker platform
        if: steps.platform.outputs.changed == 'true'
        env:
          OVH_S3_BUCKET: ${{ vars.OVH_S3_BUCKET }}
          OVH_S3_REGION: ${{ vars.OVH_S3_REGION }}
          OVH_S3_ENDPOINT: ${{ vars.OVH_S3_ENDPOINT }}
          OVH_S3_ACCESS_KEY_ID: ${{ secrets.OVH_S3_ACCESS_KEY_ID }}
          OVH_S3_SECRET_ACCESS_KEY: ${{ secrets.OVH_S3_SECRET_ACCESS_KEY }}
          OVH_S3_UPLOAD_MIRROR: ${{ vars.OVH_S3_UPLOAD_MIRROR }}
          OVH_S3_PLAYBACK_CACHE: ${{ vars.OVH_S3_PLAYBACK_CACHE }}
          OVH_S3_DIRECT_UPLOAD: ${{ vars.OVH_S3_DIRECT_UPLOAD }}
          OVH_S3_DIRECT_PLAYBACK: ${{ vars.OVH_S3_DIRECT_PLAYBACK }}
          RINLU_CDN_ENABLED: ${{ vars.RINLU_CDN_ENABLED }}
          RINLU_CDN_BASE_URL: ${{ vars.RINLU_CDN_BASE_URL }}
          RINLU_CDN_SIGNING_KEY: ${{ secrets.RINLU_CDN_SIGNING_KEY }}
          RINLU_CDN_ORIGIN_TOKEN: ${{ secrets.RINLU_CDN_ORIGIN_TOKEN }}
          HOST: ${{ secrets.OVH_HOST }}
          USER: ${{ secrets.OVH_USER }}
          PORT: ${{ vars.OVH_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          if [[ -z "$OVH_S3_BUCKET" && -z "$OVH_S3_REGION" && -z "$OVH_S3_ENDPOINT" && -z "$OVH_S3_ACCESS_KEY_ID" && -z "$OVH_S3_SECRET_ACCESS_KEY" ]]; then
            echo 'OVH S3 not configured yet; preserving the existing storage configuration.'
            exit 0
          fi
          test -n "$HOST" && test -n "$USER"
          node scripts/render-ovh-s3-env.mjs |
            ssh -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
              'set -eu; umask 077; tmp=$(mktemp "$HOME/.rinlu-storage.XXXXXX"); trap "rm -f \"$tmp\"" EXIT; cat > "$tmp"; test -s "$tmp"; chmod 600 "$tmp"; mv -f "$tmp" "$HOME/rinlu-storage.env"'
          echo 'OVH S3 credentials staged securely for the next Docker publication.'

      - name: Publish site and verify HTTP 80
        if: steps.platform.outputs.changed == 'true'
        env:
          HOST: ${{ secrets.OVH_HOST }}
          USER: ${{ secrets.OVH_USER }}
          PORT: ${{ vars.OVH_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'sudo -n /usr/local/sbin/rinlu-publish'


      - name: Verify public HTTPS platform release
        if: steps.platform.outputs.changed == 'true'
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 3 https://rinlu.com/music/healthz
          curl --fail --retry 5 https://rinlu.com/music/_release.json > /tmp/rinlu-live-release.json
          python3 - <<'PY'
          import json,pathlib
          expected=json.loads(pathlib.Path('platform-runtime/public/_release.json').read_text())
          actual=json.loads(pathlib.Path('/tmp/rinlu-live-release.json').read_text())
          assert actual['source_sha256']==expected['source_sha256'], 'Production release mismatch'
          print('Both sites synchronized:', actual['source_sha256'])
          PY

      - name: Verify public HTTPS mobile API and release overlay
        if: steps.platform.outputs.changed == 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 'https://rinlu.com/music/api/mobile/v1/capabilities' -o /tmp/rinlu-mobile-capabilities.json
          curl -fsSL --retry 5 --retry-delay 3 'https://rinlu.com/music/api/mobile/v1/bootstrap' -o /tmp/rinlu-mobile-bootstrap.json
          curl -fsSL --retry 5 --retry-delay 3 'https://rinlu.com/music/api/mobile/v1/search?q=rinlu&limit=10' -o /tmp/rinlu-mobile-search.json
          python3 - <<'PY'
          import json,pathlib
          def read(name):
              return json.loads(pathlib.Path('/tmp/'+name).read_text())
          expected=json.loads(pathlib.Path('platform-runtime/public/_release.json').read_text())
          actual=read('rinlu-live-release.json')
          assert actual['source_sha256']==expected['source_sha256'], 'Site source hash changed'
          assert actual['gateway_overlay_sha256']==expected['gateway_overlay_sha256'], 'Mobile API gateway overlay mismatch'
          cap=read('rinlu-mobile-capabilities.json')
          assert cap['version']==1 and cap['api']['catalog']=='/music/api/catalog', 'Mobile capabilities invalid'
          boot=read('rinlu-mobile-bootstrap.json')
          assert isinstance(boot.get('tracks'),list) and isinstance(boot.get('dsp'),dict), 'Mobile bootstrap incomplete'
          assert boot.get('user') is None, 'Anonymous bootstrap exposed user identity'
          assert all('owner_id' not in t and 'asset_id' not in t for t in boot['tracks']), 'Private catalog fields leaked'
          search=read('rinlu-mobile-search.json')
          assert isinstance(search.get('items'),list), 'Mobile search malformed'
          print('PUBLIC HTTPS MOBILE API VERIFIED:', len(boot['tracks']), 'public tracks')
          PY

      - name: Verify public privacy policy and footer
        if: steps.platform.outputs.changed == 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 https://rinlu.com/music/privacy -o /tmp/rinlu-privacy.html
          curl -fsSL --retry 5 --retry-delay 3 https://rinlu.com/music/ -o /tmp/rinlu-music.html
          curl -fsSL --retry 5 --retry-delay 3 https://rinlu.com/music/privacy-footer.js -o /tmp/rinlu-privacy-footer.js
          curl -fsSL --retry 5 --retry-delay 3 https://rinlu.com/ -o /tmp/rinlu-root.html
          curl -fsSL --retry 5 --retry-delay 3 https://rinlu.com/en.html -o /tmp/rinlu-root-en.html
          python3 - <<'PY'
          from pathlib import Path
          policy = Path('/tmp/rinlu-privacy.html').read_text()
          music = Path('/tmp/rinlu-music.html').read_text()
          footer = Path('/tmp/rinlu-privacy-footer.js').read_text()
          root = Path('/tmp/rinlu-root.html').read_text()
          root_en = Path('/tmp/rinlu-root-en.html').read_text()
          assert '<article id="zh"' in policy and '<article id="en"' in policy, 'Bilingual policy missing'
          assert 'Google' in policy and '隐私政策' in policy, 'Policy content missing'
          assert '/music/privacy-footer.js' in music, 'Music footer injection missing'
          assert 'dataset.rinluPrivacyFooter' in footer and '/music/privacy' in footer, 'Music footer script incorrect'
          assert 'href="/music/privacy"' in root, 'Chinese homepage footer link missing'
          assert 'href="/music/privacy?lang=en"' in root_en, 'English homepage footer link missing'
          print('PUBLIC HTTPS VALIDATION PASSED: bilingual privacy and footers')
          PY

      - name: Verify public social preview image and static crawler tags
        if: steps.platform.outputs.changed == 'true'
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 3 -L https://rinlu.com/music/ -o /tmp/rinlu-share-page.html
          curl --fail --retry 5 --retry-delay 3 -L https://rinlu.com/music/share/rinlu-neon.jpg -o /tmp/rinlu-share-image.jpg
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          html=Path('/tmp/rinlu-share-page.html').read_text()
          preview=Path('/tmp/rinlu-share-image.jpg').read_bytes()
          url='https://rinlu.com/music/share/rinlu-neon.jpg'
          assert '<meta property="og:image" content="'+url+'">' in html, 'OG image missing'
          assert '<meta name="twitter:image" content="'+url+'">' in html, 'Twitter preview missing'
          assert '<meta property="og:image:width" content="480">' in html, 'Image width missing'
          expected='7e70e193abb5732dafe68fc889b9ea9b0d823fb2fc97c8c7a72ed3015275b464'
          assert hashlib.sha256(preview).hexdigest()==expected, 'Live social image differs from approved file'
          print('PUBLIC SOCIAL PREVIEW VERIFIED: original design, 480×480 optimized JPEG')
          PY

      - name: Verify embedded Highway and shared catalog chart
        if: steps.platform.outputs.changed == 'true'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const origin='https://rinlu.com', base=origin+'/music';
          const shell=await (await fetch(base+'/pulse-highway/index.html')).text();
          assert(shell.includes('id="start-game"') && !shell.includes('band-legend') && !shell.includes('Play original demo'));
          const catalog=await (await fetch(base+'/api/catalog')).json();
          let selected;
          for(const track of catalog.tracks??[]){
            const cfg=await (await fetch(base+'/api/games/config/'+track.id)).json();
            if(cfg.highway){selected={track,cfg};break;}
          }
          assert(selected,'No approved catalog recording found');
          const {track,cfg}=selected;
          const url=base+'/api/games/native-highway/'+track.id+'?difficulty=normal&revision='+cfg.stored_revision;
          async function read(expectDatabase=false){
            const res=await fetch(url,{method:'POST',headers:{Origin:origin}});
            if(res.status===202)return null;
            assert.equal(res.status,200,'Chart endpoint '+res.status);
            if(expectDatabase)assert.equal(res.headers.get('x-rinlu-chart-source'),'database');
            return res.json();
          }
          let bundle;
          for(let i=0;i<40&&!bundle;i++){bundle=await read();if(!bundle)await new Promise(r=>setTimeout(r,2000));}
          assert(bundle?.level?.version==='LevelIRV1' && bundle.features.frames.length && bundle.level.events.length);
          const second=await read(true);
          assert.equal(second?.level?.canonicalHash,bundle.level.canonicalHash);
          console.log('Verified shared chart:',track.title,bundle.level.events.length,bundle.level.canonicalHash);
          JS
