name: Deploy RINLU website and Docker music platform

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: rinlu-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify the canonical platform release
        id: platform
        run: node scripts/prepare-platform.mjs

      - name: Build the complete platform client and gateway
        if: steps.platform.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm install --global pnpm@11.25.0
          cd .platform-source/rinlu-player-source
          pnpm install --frozen-lockfile
          node scripts/tests/accounts-integration.mjs
          node scripts/tests/external-auth-integration.mjs
          node scripts/tests/platform-gateway.test.mjs
          pnpm exec vite build --config deployment/platform/vite.config.mjs
          cd ../..
          node scripts/package-platform.mjs
          rm -rf .platform-source

      - name: Validate processor before accessing deployment credentials
        if: steps.platform.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s services/media-worker -p 'test_*.py'
          python3 -m py_compile services/media-worker/worker.py
          bash -n services/ovh/deploy-worker.sh

      - name: Configure verified SSH identity
        if: steps.platform.outputs.changed == 'true'
        env:
          PRIVATE_KEY: ${{ secrets.OVH_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        if: steps.platform.outputs.changed == 'true'
        env:
          HOST: ${{ secrets.OVH_HOST }}
          USER: ${{ secrets.OVH_USER }}
          PORT: ${{ vars.OVH_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER"
          rsync -az --delete --safe-links --exclude='.git/' --exclude='.github/' --exclude='.platform-source/' --exclude='node_modules/' -e "ssh -p $PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" ./ "$USER@$HOST:/home/ubuntu/rinlu-staging/"

      - name: Stage optional RINLU processor secrets
        if: steps.platform.outputs.changed == 'true'
        env:
          PROCESSOR: ${{ secrets.RINLU_PROCESSOR_TOKEN }}
          SITE_ACCESS: ${{ secrets.RINLU_SITES_ACCESS_TOKEN }}
          HOST: ${{ secrets.OVH_HOST }}
          USER: ${{ secrets.OVH_USER }}
          PORT: ${{ vars.OVH_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          if [[ -z "$PROCESSOR" || -z "$SITE_ACCESS" ]]; then
            echo 'Processor secrets are not configured; preserving website-only deployment.'
            exit 0
          fi
          python3 - <<'PY'
          import os,pathlib
          values={'RINLU_ORIGIN':'https://sonora-independent-music.kai-ma.chatgpt.site','RINLU_PROCESSOR_TOKEN':os.environ['PROCESSOR'],'RINLU_SITES_ACCESS_TOKEN':os.environ['SITE_ACCESS']}
          assert all(not any(c in v for c in '\r\n\0') for v in values.values())
          p=pathlib.Path('/tmp/rinlu-worker.env');p.touch(mode=0o600);p.write_text(''.join(k+'='+v+'\n' for k,v in values.items()))
          PY
          trap 'rm -f /tmp/rinlu-worker.env' EXIT
          scp -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes /tmp/rinlu-worker.env "$USER@$HOST:/home/ubuntu/rinlu-worker.env"

      - name: Publish site and verify HTTP 80
        if: steps.platform.outputs.changed == 'true'
        env:
          HOST: ${{ secrets.OVH_HOST }}
          USER: ${{ secrets.OVH_USER }}
          PORT: ${{ vars.OVH_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'sudo -n /usr/local/sbin/rinlu-publish'


      - name: Verify public HTTPS platform release
        if: steps.platform.outputs.changed == 'true'
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 3 https://rinlu.com/music/healthz
          curl --fail --retry 5 https://rinlu.com/music/_release.json > /tmp/rinlu-live-release.json
          python3 - <<'PY'
          import json,pathlib
          expected=json.loads(pathlib.Path('platform-runtime/public/_release.json').read_text())
          actual=json.loads(pathlib.Path('/tmp/rinlu-live-release.json').read_text())
          assert actual['source_sha256']==expected['source_sha256'], 'Production release mismatch'
          print('Both sites synchronized:', actual['source_sha256'])
          PY
