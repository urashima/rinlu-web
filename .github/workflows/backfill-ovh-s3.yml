name: Verify OVH S3 and backfill public RINLU music
on:
  push:
    branches: [main]
    paths:
      - 'services/ovh-s3/**'
      - 'scripts/verify-ovh-s3.mjs'
      - 'scripts/backfill-ovh-public-media.mjs'
      - '.github/workflows/backfill-ovh-s3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rinlu-ovh-s3-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OVH_S3_BUCKET: ${{ vars.OVH_S3_BUCKET }}
      OVH_S3_REGION: ${{ vars.OVH_S3_REGION }}
      OVH_S3_ENDPOINT: ${{ vars.OVH_S3_ENDPOINT }}
      OVH_S3_ACCESS_KEY_ID: ${{ secrets.OVH_S3_ACCESS_KEY_ID }}
      OVH_S3_SECRET_ACCESS_KEY: ${{ secrets.OVH_S3_SECRET_ACCESS_KEY }}
      RINLU_S3_IMPORT_MAX: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate private S3 client without real secrets
        run: node --test services/ovh-s3/tests/*.test.mjs
      - name: Verify real private OVH S3 read, write, checksum, delete
        run: node scripts/verify-ovh-s3.mjs
      - name: Copy approved public recordings to OVH S3
        run: node scripts/backfill-ovh-public-media.mjs
