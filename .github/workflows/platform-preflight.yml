name: RINLU platform preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect OVH capacity without changing services
        env:
          PRIVATE_KEY: ${{ secrets.OVH_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
          HOST: ${{ secrets.OVH_HOST }}
          USER: ${{ secrets.OVH_USER }}
          PORT: ${{ vars.OVH_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY" && test -n "$KNOWN_HOSTS" && test -n "$HOST" && test -n "$USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -eu
          printf 'CPU cores: '; getconf _NPROCESSORS_ONLN
          free -m
          df -Pm / /home
          docker --version || true
          docker compose version || true
          docker inspect rinlu-web --format 'RINLU website: {{.State.Status}}' || true
          curl -fsS --max-time 10 http://127.0.0.1/healthz || true
          printf '\nCan invoke existing publisher: '
          sudo -n -l /usr/local/sbin/rinlu-publish >/dev/null 2>&1 && echo yes || echo no
          REMOTE
