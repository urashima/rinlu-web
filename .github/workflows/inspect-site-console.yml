name: RINLU temporary Site Console build verification
on:
  push:
    branches: ['feature/console-site-share-20261120']
    paths: ['.github/workflows/inspect-site-console.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate share API and source overlay
        run: |
          set -euo pipefail
          node --check scripts/apply-platform-site.mjs
          node --check services/share-preview/share-preview.mjs
          node --test services/share-preview/share-preview.test.mjs
          node scripts/prepare-platform.mjs
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.platform-source/rinlu-player-source/app')
          console=(root/'rinlu.tsx').read_text()
          page=(root/'site-font-admin.tsx').read_text()
          component=(root/'site-share-admin.tsx').read_text()
          assert "['site-fonts',tr('Site'),Settings]" in console
          assert "['site-fonts',tr('Site fonts'),Settings]" not in console
          assert "tr('Site')" in page and '<SiteShareAdmin/>' in page
          assert 'Save share image' in component and 'Remove image' in component
          print('INTEGRATED SITE CONSOLE SOURCE VERIFIED')
          PY
      - name: Compile canonical client and Docker gateway without deployment
        run: |
          set -euo pipefail
          npm install --global pnpm@11.25.0
          cd .platform-source/rinlu-player-source
          pnpm install --frozen-lockfile
          pnpm exec vite build --config deployment/platform/vite.config.mjs
          cd ../..
          node scripts/package-platform.mjs
          node --check platform-runtime/server.mjs
          node --check platform-runtime/share-preview.mjs
          node -e "const r=require('./platform-runtime/public/_release.json');if(r.site_overlay!=='console-site-share-v1')process.exit(1)"
          test -f platform-runtime/public/source/site-share-admin.tsx
          test ! -f platform-runtime/public/share-admin.js
          if grep -q '/music/share-admin.js' platform-runtime/public/index.html; then exit 1; fi
          echo 'RINLU SITE CONSOLE FULL BUILD VERIFIED'
