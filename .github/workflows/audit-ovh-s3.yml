name: Audit canonical RINLU S3 integration surface
on:
  pull_request:
    paths:
      - 'scripts/audit-s3-surface.mjs'
      - '.github/workflows/audit-ovh-s3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download and verify canonical source without secrets
        run: node scripts/prepare-platform.mjs
      - name: Audit route surfaces, no secrets or production database access
        run: node scripts/audit-s3-surface.mjs
