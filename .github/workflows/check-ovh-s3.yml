name: Validate OVH S3 Docker deployment wiring

on:
  pull_request:
    paths:
      - deploy.sh
      - scripts/package-platform.mjs
      - scripts/apply-platform-direct.mjs
      - scripts/probe-ovh-s3-browser-direct.mjs
      - scripts/configure-ovh-s3-cors.py
      - scripts/backfill-ovh-public-media.mjs
      - scripts/tests/backfill-ovh-public-media.test.mjs
      - scripts/verify-ovh-s3.mjs
      - 'services/ovh-s3/**'
      - scripts/render-ovh-s3-env.mjs
      - scripts/tests/render-ovh-s3-env.test.mjs
      - .github/workflows/deploy.yml
      - .github/workflows/check-ovh-s3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check secret handling with synthetic credentials
        run: node --test scripts/tests/render-ovh-s3-env.test.mjs
      - name: Validate production shell deployment syntax
        run: bash -n deploy.sh
      - name: Verify S3 signing and storage bridge logic without secrets
        run: |
          node --test services/ovh-s3/tests/*.test.mjs
          node --test scripts/tests/backfill-ovh-public-media.test.mjs
          node --check services/ovh-s3/storage-gateway.mjs
          node --check scripts/package-platform.mjs
          node --check scripts/apply-platform-direct.mjs
          node --check scripts/probe-ovh-s3-browser-direct.mjs
      - name: Build canonical platform with OVH S3 bridge
        run: |
          set -euo pipefail
          node scripts/prepare-platform.mjs
          npm install --global pnpm@11.25.0
          cd .platform-source/rinlu-player-source
          pnpm install --frozen-lockfile
          pnpm exec vite build --config deployment/platform/vite.config.mjs
          cd ../..
          node scripts/package-platform.mjs
          node --check platform-runtime/server.mjs
          test -f platform-runtime/ovh-s3.mjs
          test -f platform-runtime/storage-gateway.mjs
          test -f platform-runtime/direct-storage.mjs
          test -f platform-runtime/signing.mjs
          test -f platform-runtime/public/source/browser-direct-overlay.mjs
          node --check platform-runtime/direct-storage.mjs
          node --check platform-runtime/signing.mjs

