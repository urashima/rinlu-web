name: Validate OVH S3 Docker deployment wiring

on:
  pull_request:
    paths:
      - deploy.sh
      - scripts/render-ovh-s3-env.mjs
      - scripts/tests/render-ovh-s3-env.test.mjs
      - .github/workflows/deploy.yml
      - .github/workflows/check-ovh-s3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check secret handling with synthetic credentials
        run: node --test scripts/tests/render-ovh-s3-env.test.mjs
      - name: Validate production shell deployment syntax
        run: bash -n deploy.sh
