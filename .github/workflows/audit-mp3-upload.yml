name: Inspect RINLU MP3 current upload limits
on:
  push:
    branches: [feature/mp3-192plus-vbr-upload]
    paths:
      - 'scripts/audit-mp3-upload.mjs'
      - '.github/workflows/audit-mp3-upload.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/prepare-platform.mjs
      - run: node scripts/audit-mp3-upload.mjs
