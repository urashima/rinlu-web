name: Isolated media worker rehearsal
on:
  pull_request:
    paths:
      - 'services/media-worker/**'
      - '.github/workflows/media-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the media processor image
        run: docker build --tag rinlu-media-rehearsal services/media-worker
      - name: Run the restart smoke test offline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rinlu-rehearsal-signatures"
          # Local synthetic signature for CI. OVH uses its installed database.
          printf '%s\n' 'Rinlu.Rehearsal.Canary:0:*:52494e4c552052454845415253414c2043414e415259' > "$RUNNER_TEMP/rinlu-rehearsal-signatures/ci.ndb"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 2g --cpus 1 --pids-limit 64 \
            --tmpfs /tmp:size=256m,mode=1777 \
            --mount "type=bind,src=$RUNNER_TEMP/rinlu-rehearsal-signatures,dst=/var/lib/clamav,readonly" \
            --mount "type=bind,src=$PWD/services/media-worker,dst=/qa,readonly" \
            --entrypoint python3 rinlu-media-rehearsal /qa/rehearse.py --jobs 2
