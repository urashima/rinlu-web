name: Inspect canonical RINLU direct upload client
on:
  pull_request:
    paths:
      - scripts/audit-direct-upload.mjs
      - .github/workflows/audit-direct-upload.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/prepare-platform.mjs
      - run: node scripts/audit-direct-upload.mjs
