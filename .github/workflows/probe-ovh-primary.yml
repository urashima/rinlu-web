name: Verify real S3-only CopyObject on OVH Virginia
on:
  push:
    branches: [feature/ovh-s3-exclusive-primary]
    paths:
      - 'scripts/verify-ovh-s3-primary.mjs'
      - '.github/workflows/probe-ovh-primary.yml'
permissions:
  contents: read
jobs:
  s3-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OVH_S3_BUCKET: ${{ vars.OVH_S3_BUCKET }}
      OVH_S3_REGION: ${{ vars.OVH_S3_REGION }}
      OVH_S3_ENDPOINT: ${{ vars.OVH_S3_ENDPOINT }}
      OVH_S3_ACCESS_KEY_ID: ${{ secrets.OVH_S3_ACCESS_KEY_ID }}
      OVH_S3_SECRET_ACCESS_KEY: ${{ secrets.OVH_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify unit tests with no real keys
        run: node --test services/ovh-s3/tests/primary-media.test.mjs services/ovh-s3/tests/s3.test.mjs
      - name: Verify private OVH S3 CopyObject and exact checksum
        run: node scripts/verify-ovh-s3-primary.mjs
