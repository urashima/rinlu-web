name: Inspect RINLU public playback authorizer
on:
  pull_request:
    paths:
      - scripts/inspect-ovh-auth.mjs
      - .github/workflows/inspect-ovh-auth.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/prepare-platform.mjs
      - run: node scripts/inspect-ovh-auth.mjs
