services:
  media-worker:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1
    pids_limit: 64
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - signatures:/var/lib/clamav
    environment:
      SONORA_ORIGIN: ${RINLU_ORIGIN:-${SONORA_ORIGIN:-}}
      SONORA_PROCESSOR_TOKEN: ${RINLU_PROCESSOR_TOKEN:-${SONORA_PROCESSOR_TOKEN:-}}
      SONORA_SITES_ACCESS_TOKEN: ${RINLU_SITES_ACCESS_TOKEN:-${SONORA_SITES_ACCESS_TOKEN:-}}
      SONORA_SMTP_HOST: ${RINLU_SMTP_HOST:-${SONORA_SMTP_HOST:-}}
      SONORA_SMTP_PORT: ${RINLU_SMTP_PORT:-${SONORA_SMTP_PORT:-587}}
      SONORA_SMTP_USER: ${RINLU_SMTP_USER:-${SONORA_SMTP_USER:-}}
      SONORA_SMTP_PASSWORD: ${RINLU_SMTP_PASSWORD:-${SONORA_SMTP_PASSWORD:-}}
      SONORA_SMTP_MODE: ${RINLU_SMTP_MODE:-${SONORA_SMTP_MODE:-}}
      SONORA_MAIL_FROM: ${RINLU_MAIL_FROM:-${SONORA_MAIL_FROM:-}}
      SONORA_ALERT_WEBHOOK: ${RINLU_ALERT_WEBHOOK:-${SONORA_ALERT_WEBHOOK:-}}
      RINLU_S3_PROCESSOR_MODE: ${RINLU_S3_PROCESSOR_MODE:-0}
      RINLU_S3_BUCKET: ${RINLU_S3_BUCKET:-}
      RINLU_S3_REGION: ${RINLU_S3_REGION:-}
      RINLU_S3_ENDPOINT: ${RINLU_S3_ENDPOINT:-}
      RINLU_S3_ACCESS_KEY_ID: ${RINLU_S3_ACCESS_KEY_ID:-}
      RINLU_S3_SECRET_ACCESS_KEY: ${RINLU_S3_SECRET_ACCESS_KEY:-}
volumes:
  signatures:
