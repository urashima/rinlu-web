server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
    location ~* \.(css|js)$ { expires 5m; try_files $uri =404; }
    location ~ /\. { deny all; }
}
