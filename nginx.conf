# Caddy terminates HTTPS on :443 and forwards to this HTTP-only Nginx.
# Redirect direct requests for rinlu.com, but never redirect Caddy's HTTPS
# upstream requests or the localhost health checks used by deployment.
map $http_x_forwarded_proto $rinlu_is_https {
    default 0;
    https 1;
}
map "$host:$rinlu_is_https" $rinlu_http_redirect {
    default 0;
    "rinlu.com:0" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    if ($rinlu_http_redirect) {
        return 308 https://rinlu.com$request_uri;
    }
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /music { return 308 /music/; }
  location ^~ /music/ {
    proxy_pass http://rinlu-platform:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
    client_max_body_size 32m;
  }
  location / { try_files $uri $uri/ /index.html; }
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
    location ~* \.(css|js)$ { expires 5m; try_files $uri =404; }
    location ~ /\. { deny all; }
}

